name: spendwise
description: SpendWise - Personal Expense Tracker Flutter App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Firebase
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.2.0
  
  # State Management
  provider: ^6.1.5
  
  # Charts
  fl_chart: ^0.70.2
  
  # UI
  google_fonts: ^6.2.1
  intl: ^0.20.2
  
  # HTTP for AI chat
  http: ^1.3.0
  
  # URL launcher
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/
